# kumu 試験 と kumu 点検 を Linux と macOS で動かし、surl を作って、curl と同じ答えになるかを手元のサーバーで確かめます。
name: 試験

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: clang と OpenSSL を入れる(Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev
      - name: OpenSSL の pkg-config を探せるようにする(macOS)
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 > /dev/null 2>&1 || brew install openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: kumu と suruc を入れる
        # @main は Go のモジュールのプロキシが少し前の main を覚えていることがあるので、GitHub から直接取る
        env:
          GOPROXY: direct
          GONOSUMDB: github.com/suru-lang/*
        run: |
          go install github.com/suru-lang/suru/cmd/kumu@main
          go install github.com/suru-lang/suru/cmd/suruc@main
      - name: 試験
        run: ~/go/bin/kumu 試験
      - name: 点検
        run: ~/go/bin/kumu 点検
      - name: curl と比べる
        run: |
          ~/go/bin/kumu 作る
          S="$PWD/出力/surl"
          mkdir -p 出力/www 出力/取得 && cd 出力/www
          head -c 300000 /dev/urandom > r.bin
          printf 'こんにちは\n' > a.txt
          python3 -m http.server 18555 > ../http.log 2>&1 &
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:18555/ && break; sleep 0.2; done
          cd ../取得
          U=http://127.0.0.1:18555
          "$S" $U/a.txt | cmp - <(curl -s $U/a.txt)
          "$S" -o r.bin 127.0.0.1:18555/r.bin && cmp r.bin ../www/r.bin
          "$S" $U/r.bin | cmp - ../www/r.bin
          "$S" -O $U/a.txt && cmp a.txt ../www/a.txt
          code() { "$@" > /dev/null 2>&1; echo $?; }
          check() { want=$1; shift; got=$(code "$S" "$@"); curlgot=$(code curl "$@"); echo "$* → surl $got / curl $curlgot"; [ "$got" = "$want" ] && [ "$curlgot" = "$want" ]; }
          check 0 -s $U/none
          check 22 -sf $U/none
          check 7 -s http://127.0.0.1:1/
          check 6 -s http://nonexistent.invalid/
          # 新しい curl は名前のない -O を curl_response に書くので、surl だけを確かめる
          [ "$(code "$S" -s -O $U/)" = 23 ]
          check 2 -s --zz $U/
          kill %1
      - name: 送るものを curl と比べる
        run: |
          python3 .github/試験/こだま.py 18556 &
          for i in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:18556/ && break; sleep 0.2; done
          S="$PWD/出力/surl"; U=http://127.0.0.1:18556
          printf 'a\nb\r\n' > 出力/d.txt
          # 見出しの順と User-Agent は違ってよいので、並べ替えて User-Agent をそろえてから比べる
          same() { a=$("$S" "$@" | sed 's/^User-Agent: suru-http/User-Agent: X/' | sort); b=$(curl -s "$@" | sed 's/^User-Agent: curl.*/User-Agent: X/' | sort); echo "$*"; [ "$a" = "$b" ] || { diff <(echo "$a") <(echo "$b"); false; }; }
          same $U/x
          same -d a=1 -d b=2 $U/p
          same -d @出力/d.txt $U/p
          same --data-binary @出力/d.txt $U/p
          same --data-raw @x $U/p
          same --data-urlencode "q=a b&c" --data-urlencode "=x/y" --data-urlencode "z z" --data-urlencode "n@出力/d.txt" $U/p
          same -G -d a=1 -d b=2 "$U/g?x=0"
          same --json '{"a":1}' --json '[2]' $U/j
          same -X DELETE -H "X-A: 1" -H "Accept:" $U/h
          same -A myua -e http://ref/ -b "a=1" -u "u:p" $U/h
          same -H "User-Agent: hh" -A myua $U/h
          [ "$(echo hi | "$S" -d @- $U/s | tail -1)" = "hi" ]
          "$S" -I $U/h | head -1 | grep -q '^HTTP/1.1 200 OK'
          # 見る: -i・-D・-v・-w
          [ "$("$S" -i $U/i | head -1 | tr -d '\r')" = "$(curl -s -i $U/i | head -1 | tr -d '\r')" ]
          "$S" -s -D 出力/頭 -o /dev/null $U/d && grep -q '^X-Up: Yes' 出力/頭
          "$S" -v $U/v 2>&1 >/dev/null | grep -qx '> GET /v HTTP/1.1'
          "$S" -v $U/v 2>&1 >/dev/null | grep -qx '< HTTP/1.1 200 OK'
          F='%{http_code} %{response_code} %{method} %{url_effective} %{num_redirects}\n'
          [ "$("$S" -s -o /dev/null -w "$F" $U/w)" = "$(curl -s -o /dev/null -w "$F" $U/w)" ]
          [ "$("$S" -s -o /dev/null -w '%{size_download}' $U/w)" -gt 0 ]
          # たどる: -L・--max-redirs
          R=$U/redir
          same $R/302?to=/x
          same -L $R/302?to=/x
          same -L -d a=1 $R/301?to=/x
          same -L -d a=1 $R/302?to=x
          same -L -d a=1 $R/303?to=%3Fq%3D1
          same -L -d a=1 $R/307?to=/x
          same -L -d a=1 $R/308?to=/x
          same -L -I -A x $R/303?to=/x
          same -L -X DELETE -d a=1 $R/302?to=/x
          same -L -G -d a=1 $R/307?to=/x
          same -L -u u:p $R/302?to=/x
          same -L -u u:p -H "Cookie: c=1" "$R/302?to=http://localhost:18556/x"
          same -L "$R/302?to=/redir/307%3Fto%3D/x"
          F='%{http_code} %{num_redirects} %{url_effective}\n'
          [ "$("$S" -sL -o /dev/null -w "$F" "$R/302?to=/redir/301%3Fto%3D/x")" = "$(curl -sL -o /dev/null -w "$F" "$R/302?to=/redir/301%3Fto%3D/x")" ]
          [ "$("$S" -sLi $R/302?to=/x | grep -c '^HTTP/')" = 2 ]
          check() { want=$1; shift; got=$(code "$S" "$@"); curlgot=$(code curl "$@"); echo "$* → surl $got / curl $curlgot"; [ "$got" = "$want" ] && [ "$curlgot" = "$want" ]; }
          code() { "$@" > /dev/null 2>&1; echo $?; }
          check 47 -sL --max-redirs 1 "$R/302?to=/redir/302%3Fto%3D/x"
          check 0 -sL --max-redirs 2 "$R/302?to=/redir/302%3Fto%3D/x"
          # 時間: 何も返さない相手に -m、届かないアドレスに --connect-timeout、503 を --retry
          python3 -c 'import socket,time; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1); s.bind(("127.0.0.1",18557)); s.listen(50); c=[s.accept() for _ in range(9)]; time.sleep(30)' &
          sleep 0.5
          check 28 -s -m 1 http://127.0.0.1:18557/
          check 28 -s --connect-timeout 1 http://10.255.255.1/
          check 22 -sf --retry 2 --retry-delay 0 $U/code/503
          [ "$("$S" -f --retry 1 --retry-delay 0 $U/code/503 2>&1 | grep -c 'やり直します')" = 1 ]
          kill %1 %2
